name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bump this salt when you want to bust every cache in this workflow at once
# (e.g. after a corrupt cache incident or an unrelated toolchain change).
env:
  CACHE_VERSION: v2
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          # Include OS, arch, node major and a manual salt so caches are only
          # ever reused when the full toolchain matches. `hashFiles` on the
          # lockfile keeps it bound to the exact resolved dependency tree.
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc -b

      - name: Run unit tests
        run: npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Audit contrast (WCAG AA tokens)
        run: npm run audit:contrast

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_DEMO_MODE: 'false'
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_BUILD_DATE: ${{ github.run_started_at }}

  # Dynamically compute how many shards to run based on the current test
  # count so new spec files under the e2e umbrella keep CI fast without any
  # manual matrix edits. Roughly TESTS_PER_SHARD tests per shard, capped at
  # MAX_SHARDS to avoid runner queue starvation on small PRs.
  plan-e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      shards: ${{ steps.compute.outputs.shards }}
      total:  ${{ steps.compute.outputs.total }}
    env:
      E2E_SPECS: smoke.spec.ts painel-cronograma-entrega-sync.spec.ts
      TESTS_PER_SHARD: '4'
      MAX_SHARDS: '6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Compute shard matrix
        id: compute
        run: |
          set -euo pipefail
          # --list does not launch browsers, so no Playwright browser cache needed.
          COUNT=$(npx playwright test $E2E_SPECS --list 2>&1 \
            | grep -oE 'Total:? *[0-9]+ *tests?' \
            | grep -oE '[0-9]+' \
            | tail -1)
          COUNT=${COUNT:-1}
          TOTAL=$(( (COUNT + TESTS_PER_SHARD - 1) / TESTS_PER_SHARD ))
          [ "$TOTAL" -lt 1 ] && TOTAL=1
          [ "$TOTAL" -gt "$MAX_SHARDS" ] && TOTAL=$MAX_SHARDS
          SHARDS=$(seq -s, 1 $TOTAL)
          echo "Detected $COUNT e2e tests → $TOTAL shard(s)"
          echo "shards=[$SHARDS]" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"    >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    needs: [build, plan-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      # Don't cancel siblings — we want per-shard traces from every failure.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-e2e.outputs.shards) }}
    env:
      SHARD_TOTAL: ${{ needs.plan-e2e.outputs.total }}
      E2E_SPECS: smoke.spec.ts painel-cronograma-entrega-sync.spec.ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (when browsers were cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E (shard ${{ matrix.shard }}/${{ env.SHARD_TOTAL }})
        run: npx playwright test $E2E_SPECS --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_GIT_COMMIT: ${{ github.sha }}
          VITE_GIT_BRANCH: ${{ github.ref_name }}
          VITE_BUILD_DATE: ${{ github.run_started_at }}
          TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
          TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}

      - name: Upload Playwright HTML report (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces & screenshots (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-e2e-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

      - name: Upload JUnit results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-e2e-shard-${{ matrix.shard }}
          path: playwright-report/junit.xml
          retention-days: 14
          if-no-files-found: ignore


  painel-obras-regression:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (when browsers were cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run /gestao/painel-obras admin regression (desktop + mobile)
        run: npx playwright test painel-obras-admin-regression.spec.ts --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}

      - name: Upload painel-obras HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-painel-obras-report
          path: playwright-report/
          retention-days: 14

      - name: Upload painel-obras traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-painel-obras-artifacts
          path: test-results/
          retention-days: 14

  a11y:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node${{ env.NODE_VERSION }}-modules-${{ env.CACHE_VERSION }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.CACHE_VERSION }}-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (when browsers were cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run axe-core a11y suite
        run: npm run test:a11y -- --reporter=list
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}
          TEST_STAFF_EMAIL: ${{ secrets.TEST_STAFF_EMAIL }}
          TEST_STAFF_PASSWORD: ${{ secrets.TEST_STAFF_PASSWORD }}
          TEST_PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}

      - name: Upload a11y HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-report
          path: playwright-report/
          retention-days: 14

      - name: Upload a11y traces & screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-artifacts
          path: test-results/
          retention-days: 14
